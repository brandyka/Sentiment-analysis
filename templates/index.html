<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-robot text-2xl text-blue-600"></i>
                <h1 class="text-xl font-bold text-gray-900">Sentiment Analyzer</h1>
            </div>
            <a href="/dashboard" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-300 flex items-center space-x-2">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-6 py-12 flex items-center justify-center">
        <div class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-lg text-center">
            <h2 class="text-3xl font-bold mb-2">Analyze Your Review Sentiment</h2>
            <p class="text-gray-600 mb-8">Enter a text or review below to find out the sentiment.</p>

            <form id="sentimentForm">
                <textarea id="textInput" name="text" rows="6" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-300" placeholder="Example: The service was excellent and the food was delicious!"></textarea>
                
                <button type="submit" class="mt-6 w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105 duration-300 flex items-center justify-center space-x-2">
                    <i class="fas fa-paper-plane"></i>
                    <span>Analyze now</span>
                </button>
            </form>

            <!-- Result Message Area -->
            <div id="resultMessage" class="mt-6 p-4 rounded-lg text-center font-medium" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white mt-auto">
        <div class="container mx-auto px-6 py-4 text-center text-gray-500">
            <p>&copy; 2025 Sentiment Analyzer. made by Flask & Tailwind CSS.</p>
        </div>
    </footer>

    <script>
        document.getElementById('sentimentForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const textInput = document.getElementById('textInput');
            const resultMessage = document.getElementById('resultMessage');
            const text = textInput.value.trim();

            if (!text) {
                showMessage('Text cannot be empty!', 'error');
                return;
            }

            // Show loading state
            showMessage('Menganalisis...', 'loading');

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text }),
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message || 'Review berhasil dikirim!', 'success');
                    textInput.value = ''; // Clear textarea on success
                } else {
                    throw new Error(result.error || 'Terjadi kesalahan.');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            }
        });

        function showMessage(message, type) {
            const resultMessage = document.getElementById('resultMessage');
            resultMessage.textContent = message;
            
            // Reset classes
            resultMessage.className = 'mt-6 p-4 rounded-lg text-center font-medium';

            if (type === 'success') {
                resultMessage.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                resultMessage.classList.add('bg-red-100', 'text-red-800');
            } else if (type === 'loading') {
                resultMessage.classList.add('bg-blue-100', 'text-blue-800');
            }
            
            resultMessage.style.display = 'block';

            // Hide the message after 5 seconds, except for loading
            if (type !== 'loading') {
                setTimeout(() => {
                    resultMessage.style.display = 'none';
                }, 5000);
            }
        }
    </script>

</body>
</html>
